<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Membres</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='membres.css') }}" />
</head>
<body>

  <!-- HEADER / TOOLBAR -->
  <section class="navbar">
  <header class="topbar">
    <div class="topbar-left">
      <a class="icon-btn" href="{{ url_for('home') }}">Home</a>
      <div id="logo-slot" class="logo-slot" aria-label="Emplacement logo">LOGO</div>

      <div class="company">
        <div id="companyName" class="company-name">{{ company }}</div>
        <div class="company-sub">Groupes</div>
      </div>

      <div class="company-mark" aria-hidden="true">🏢</div>
    </div>

    <div class="topbar-center">
      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher par nom de membre..."
          aria-label="Rechercher"
        />
      </div>
    </div>

    <div class="topbar-right">
      <div class="user">
        <div id="userFullName" class="user-name">{{ first_name }} {{ last_name }}</div>
        <div id="userGroup" class="user-group">Role : {{ role_name }}</div>
      </div>
      <a class="logout" href="{{ url_for('logout') }}">Logout</a>
    </div>
  </header>

  <div class="topbar-dropdown">
    <a class="topbar-dropdown-btn" href="{{ url_for('groups_page') }}">Groupes</a>
    <a class="topbar-dropdown-btn" href="{{ url_for('membres') }}">Membres</a>
  </div>

  </section>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h2>Membres</h2>
        <div id="countInfo" class="muted"></div>
      </div>
      <div id="membersList" class="members-grid"></div>
    </section>
  </main>

  <script>
    let all_members = [];

    async function chargerMembres() {
      const reponse = await fetch("/allmembers");
      const data = await reponse.json();
      all_members = data;
    }

    function renderMembres(items) {
      const list = document.getElementById("membersList");
      const countInfo = document.getElementById("countInfo");
      list.innerHTML = "";
      countInfo.textContent = items.length + " membre(s)";

      if (!items.length) {
        list.innerHTML = `<div class="empty">Aucun membre trouvé.</div>`;
        return;
      }

      items.forEach(m => {
        const card = document.createElement("a");
        card.className = "member-card";
        card.href = `/profile/${m.id}`;
        const initiales = m.name[0].toUpperCase() + m.last_name[0].toUpperCase();
        card.innerHTML = `
          <div class="member-avatar">${initiales}</div>
          <div class="member-name">${m.name} ${m.last_name}</div>
        `;
        list.appendChild(card);
      });
    }

    function appliquerRecherche() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtres = all_members.filter(m =>
        (m.name + " " + m.last_name).toLowerCase().includes(q)
      );
      renderMembres(filtres);
    }

    document.getElementById("searchInput").addEventListener("input", appliquerRecherche);

    async function initialiserMembres() {
      await chargerMembres();
      renderMembres(all_members);
    }

    initialiserMembres();
  </script>
</body>
