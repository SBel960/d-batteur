<!DOCTYPE html>
<!-- Page d'inscription — création d'un nouveau compte client.
     Flask passe all_groups pour permettre à l'utilisateur de rejoindre des groupes dès l'inscription. -->

<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Les Débatteurs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='registry.css') }}" />
  </head>
  <body>
    <main class="registry-main">
      <div class="registry-card">

        <!-- ── Logo ── -->
        <div class="registry-logo">
          <img src="{{ url_for('static', filename='logo.svg') }}" alt="Les Débatteurs" width="48" height="48">
        </div>
        <h1 class="registry-title">Créer un compte</h1>

        <!-- message d'erreur Flask, ex: "ce compte existe déjà" -->
        {% if message %}
          <p class="registry-error">{{ message }}</p>
        {% endif %}

        <form method="post" action='{{ url_for("registry") }}'>

          <!-- ── Prénom / Nom ── -->
          <div class="field-group">
            <div class="field">
              <label for="first-name">Prénom</label>
              <input class="form-control" id="first-name" name="first-name" type="text" placeholder="Votre prénom" required />
            </div>
            <div class="field">
              <label for="last-name">Nom</label>
              <input class="form-control" id="last-name" name="last-name" type="text" placeholder="Votre nom" required />
            </div>
          </div>
          

          <!-- ── Email ── -->
          <div class="field">
            <label for="email">Adresse e-mail</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="exemple@email.com" required />
          </div>


           <!-- ── Mot de passe ── -->
          <div class="field">
            <label for="new-password">Mot de passe</label>
            <input class="form-control" id="new-password" name="new-password" type="password" placeholder="8 caractères minimum" required />
          </div>

           <!-- ── Entreprise ── -->
          <div class="field">
            <label for="company-name">Nom de l'entreprise</label>
            <input class="form-control" id="company-name" name="company-name" type="text" placeholder="Votre entreprise" required />
          </div>

          <!-- ── Choix du rôle ── -->
          <div class="field">
            <label>Rôle</label>
            <div class="role-choice">
              <label class="role-option">
                <input type="radio" name="role" value="CEO" checked />
                <span>CEO</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="Manager" />
                <span>Manager</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="Employe" />
                <span>Employé</span>
              </label>
            </div>
          </div>


          <!-- ── Rejoindre des groupes — affiché uniquement s'il existe des groupes ── -->
          {% if all_groups %}
          <div class="field">
            <label>Rejoindre des groupes <span class="optional">(optionnel)</span></label>
            <div class="groups-choice">
              {% for groupe in all_groups %}
              <label class="group-option">
                <input type="checkbox" name="groupes" value="{{ groupe[0] }}" />
                <span>{{ groupe[1] }}</span>
              </label>
              {% endfor %}
            </div>
          </div>
          {% endif %}

          <!-- ── Case à cocher obligatoire avant soumission ── -->
          <label class="terms-label">
            <input type="checkbox" required name="terms-and-conditions" />
            J'accepte les <a href="#">conditions d'utilisation</a>
          </label>

          <input class="icon-btn submit-btn" type="submit" value="Créer mon compte" />
        </form>

        <p class="login-link">Déjà un compte ? <a href="{{ url_for('login_page') }}">Se connecter</a></p>
      </div>
    </main>
  </body>
</html>
