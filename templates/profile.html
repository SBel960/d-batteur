<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Membres</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}" />
</head>
<body>

  <!-- HEADER / TOOLBAR -->
  <section class="navbar">
  <header class="topbar">
    <div class="topbar-left">
      <a class="icon-btn" href="{{ url_for('home') }}">Home</a>
      <div id="logo-slot" class="logo-slot" aria-label="Logo Les Débatteurs">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Les Débatteurs" width="32" height="32">
      </div>

      <div class="company">
        <div id="companyName" class="company-name">{{ company }}</div>
        <div class="company-sub">Membre</div>

      </div>

      <div class="company-mark" aria-hidden="true">🏢</div>
    </div>

    <div class="topbar-center">
      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher par nom de membre..."
          aria-label="Rechercher"
        />
      </div>
    </div>

    <div class="topbar-right">
      <div class="user">
        <div id="userFullName" class="user-name">{{ first_name }} {{ last_name }}</div>
        <div id="userGroup" class="user-group">Role : {{ role_name }}</div>
      </div>
      <a class="logout" href="{{ url_for('logout') }}">Logout</a>
    </div>
  </header>

  <div class="topbar-dropdown">
    <a class="topbar-dropdown-btn" href="{{ url_for('groups_page') }}">Groupes</a>
    <a class="topbar-dropdown-btn" href="{{ url_for('membres') }}">Membres</a>
  </div>
  
  </section>
    <main class="container">
    <div class="info">
        <h2>Profil</h2>
        <div class='infoBox'>
            <div class="infoName">Prénom : </div>
            <div class="infoText"> {{name_p}}</div>
        </div>
        <div class='infoBox'>
            <div class="infoName">Nom : </div>
            <div class="infoText"> {{last_name_p}}</div>
        </div>
        <div class='infoBox'>
            <div class="infoName">Email : </div>
            <div class="infoText"> {{email_p}}</div>
        </div>
        <div class='infoBox'>
            <div class="infoName">Role : </div>
            <div class="infoText"> {{role_p}}</div>
        </div>
        
        <div class="infoBox">
            <div class="infoName">Groupe(s) :</div>
            <div class="infoText">
                {%for group in groupes %}
            
                <ul><a href="/group_info/{{group['id']}}">{{group['name']}} </a> </ul>
                {%endfor%}
            </div>
        </div>
    </div>  
    

  </main>
