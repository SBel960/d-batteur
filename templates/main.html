<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}"/>
    <title> Discussion </title>
</head>
<body>
    
    <!-- HEADER / TOOLBAR -->
  <header class="topbar">
    <!-- Gauche : Entreprise + emplacement logo + logo -->
    <div class="topbar-left">
      <div id="logo-slot" class="logo-slot" aria-label="Emplacement logo">LOGO</div>

      <div class="company">
        <div id="companyName" class="company-name">NomEntreprise</div>
        <div class="company-sub">Topics</div>
      </div>

      <div class="company-mark" aria-hidden="true">🏢</div>
    </div>

    <!-- Centre : recherche (titre uniquement) -->
    <div class="topbar-center">
      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher par titre de discussion..."
          aria-label="Rechercher"
        />
      </div>
    </div>

    <!-- Droite : user + groupe + bouton + -->
    <div class="topbar-right">
      <div class="user">
        <div id="userFullName" class="user-name">Prénom Nom</div>
        <div id="userGroup" class="user-group">Groupe : ...</div>
      </div>
    </div>
  </header>


  <main>
    <section class="information-section">
      <div class="topic-title-container">
        <span class="topic-title">
         {{title}}
        </span>
      </div>
      <div class="description-container">
        <div class="description">
            {{content}}
        </div>
      </div>
    </section>
    
    <!-- Essayer de trouver un moyen de transférer les pouces bleus et rouges dans la section vote -->
    <!-- Forme de la représentation des résultats du vote encore à décider -->

    <section class="interactive-section">
      <div class="voting-results">
        <div class="voting-bar-results">
          <div class="bar-for"></div>
          <div class="bar-against"></div>
        </div>
        <div class="btn-area">
          <a class="icon-btn" href="{{ url_for('like_discussion', discussion_id=discussion_id , action='like') }}">👍</a>
          <a class="icon-btn" href="{{ url_for('like_discussion', discussion_id=discussion_id , action='unlike') }}">👎</a>
        </div>
      </div>
      <div class="comments">
        <div class="commentInput">
          <form class="commentForm" method="post" action='{{url_for("commentaire", discussion_id=discussion_id)}}'>
            <label for="comment_input"> Commentaires </label>
            <input type="text" class="form-control" name="commentaire" placeholder="ton commentaire ici" id="comment_input">
            <input class="icon-btn" type="submit" value="Envoyer">
          </form>
        </div>
        <div class="commentUser">
          
        </div>
        {% for  comment in comments %}
        <div class="commentText">
          {{ comment }}
        </div>
        {% endfor %}
      </div>
    </section>
  </main>

  <script>
        /*Script JS à remplir*/
    const state = {
      companyName: "ACME Corp",
      user: {
        firstName: "Sara",
        lastName: "Dupont",
        group: "Groupe A",
        role: "MANAGER",
        managedGroups: ["Groupe A", "Groupe C"]
      }
    }

      document.getElementById("companyName").textContent = state.companyName;
      document.getElementById("userFullName").textContent = `${state.user.firstName} ${state.user.lastName}`;
      document.getElementById("userGroup").textContent = `Groupe : ${state.user.group}`;

  </script>
</body>
</html>
