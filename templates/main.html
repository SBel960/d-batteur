<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}"/>
    <title> Discussion </title>
</head>
<body>
    
    <!-- HEADER / TOOLBAR -->
  <header class="topbar">
    <!-- Gauche : Entreprise + emplacement logo + logo -->

    <div class="topbar-left">
      <div id="logo-slot" class="logo-slot" aria-label="Emplacement logo">LOGO</div>

      <div class="company">
        <div id="companyName" class="company-name">{{company}}</div>
        <div class="company-sub">Topics</div>
      </div>

      <div class="company-mark" aria-hidden="true">🏢</div>
    </div>

    <!-- Centre : recherche (titre uniquement) -->
    <div class="topbar-center">
      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher par titre de discussion..."
          aria-label="Rechercher"
        />
      </div>
    </div>

    <!-- Droite : user + groupe + bouton + -->
    <div class="topbar-right">
      <div class="user">
        <div id="userFullName" class="user-name">{{first_name}} {{last_name}}</div>
        <div id="userGroup" class="user-group">Groupe : {{group_name}}</div>
         <div class="company-mark"> <a class="logout" href="{{url_for('logout')}}"> Logout </a></div>
      </div>
    </div>
  </header>


  <main>
    <section class="information-section">
      <div class="topic-title-container">
        <span class="topic-title">
         {{title}}
        </span>
      </div>
      <div class="description-container">
        <div class="description">
            {{content}}
        </div>
      </div>
    </section>
    
    <!-- Essayer de trouver un moyen de transférer les pouces bleus et rouges dans la section vote -->
    <!-- Forme de la représentation des résultats du vote encore à décider -->

    <section class="interactive-section">
      <div class="voting-results">
        <div class="voting-bar-results">
          <div id="bar-for" class="bar-for"></div>
          <div id="bar-against" class="bar-against"></div>
        </div>
        <div class="btn-area">
          <a id="likes-count" class="icon-btn" href="{{ url_for('like_discussion', discussion_id=discussion_id , action='like') }}">👍 {{likes}}</a>
          <a id="dislikes-count" class="icon-btn" href="{{ url_for('like_discussion', discussion_id=discussion_id , action='unlike') }}">👎 {{dislikes}}</a>
        </div>
      </div>
      <div class="comments">
        <div class="commentInput">
          <form class="commentForm" method="post" action='{{url_for("commentaire", discussion_id=discussion_id)}}'>
            <label for="comment_input"> Commentaires </label>
            <input type="text" class="form-control" name="commentaire" placeholder="Ajoutez votre commentaire..." id="comment_input">
            <input class="icon-btn submit-button" type="submit" value="Envoyer">
          </form>
        </div>
        <div class="commentUser">
          
        </div>
        {% for  comment in comments %}
        <div class="commentTextList">
          <div class="commentText">
            {{ comment["content"] }}
          </div>
            <div class="commentLike">
            <div class="btn-area">
              {% set id=comment['id_c'] %}
              <a class="likes-count" href="{{ url_for('like_comment', discussion_id=discussion_id , comment_id=id, action='like') }}">👍 {{comment['like']}}</a>
              <a class="dislikes-count" href="{{ url_for('like_comment', discussion_id=discussion_id , comment_id=id, action='unlike')}}">👎 {{comment['dislike']}}</a>
            </div>

          </div>
          
          {% endfor %}
        </div>
      </div>
    </section>
  </main>

  <script>

    /*Script JS à remplir*/

    const barFor = document.getElementById("bar-for");
    const barAgainst = document.getElementById("bar-against"); 
    
    let likesText = document.getElementById('likes-count').textContent; 
    let dislikesText = document.getElementById('dislikes-count').textContent; 
    let likesCount = Number(likesText.slice(2)); 
    let dislikesCount = Number(dislikesText.slice(2)); 
    
    const total = likesCount + dislikesCount; 

    if (total > 0) {
      barFor.style.width = (likesCount * 100 / total) + "%";
      barFor.style.setProperty("--likesCount", `"${likesCount * 100 / total}%"`);
      barAgainst.style.width = (dislikesCount * 100 / total) + "%";
      barAgainst.style.setProperty("--dislikesCount", `"${dislikesCount * 100 / total}%"`);
    } else {
      barFor.style.width = "50%"; 
      barFor.style.setProperty("--likesCount", `"50%"`);
      barAgainst.style.width = "50%"; 
      barAgainst.style.setProperty("--dislikesCount", `"50%"`);
    }

  </script>
</body>
</html>
