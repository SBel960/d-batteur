<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Discussions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='homepage.css') }}" />
</head>
<body>

  <!-- HEADER / TOOLBAR -->
  <section class="navbar">
  <header class="topbar">
    <div class="topbar-left">
      <div id="logo-slot" class="logo-slot" aria-label="Emplacement logo">LOGO</div>

      <div class="company">
        <div id="companyName" class="company-name">{{company}}</div>
        <div class="company-sub">Accueil</div>
      </div>

      <div class="company-mark" aria-hidden="true">🏢</div>
    </div>

    <div class="topbar-center">
      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Rechercher par titre de discussion..."
          aria-label="Rechercher"
        />
      </div>
    </div>

    <div class="topbar-right">
      <div class="user">
        <div id="userFullName" class="user-name">{{first_name}} {{last_name}}</div>
        <div id="userGroup" class="user-group">Role : {{role_name}}</div>
      </div>
      <a class="logout" href="{{url_for('logout')}}"> Logout </a>

      {% if role >= 2 %}
      <button id="addDiscussionBtn" commandfor="newDiscussion" command="show-modal" class="icon-btn" title="Ajouter une discussion">
        +
      </button>

      <dialog id="newDiscussion">
        <button id="closePage" commandfor="newDiscussion" command="request-close">
          x
        </button>

        <form class="newDiscussionForm" method="post" action='{{url_for("ajouter_discussion")}}'>
          <label> Nouvelle discussion</label>
          <div class="discussionInformation">
            <input type="text" class="questionBlock" name='discussionTitle' placeholder=" Ajouter un titre" required>
            <textarea type="text" class="contentBlock" name="discussionContent" placeholder=" Ajouter une description" required></textarea>
          </div>

          <div class="form-choices">
            <div class="discussionType">
              <div>
                <input type="radio" name="discussionType" id="ouvert" value="ouvert" required>
                <label for="ouvert"> Proposition </label>
              </div>
              <div>
                <input type="radio" name="discussionType" id="yesno" value="ferme" required>
                <label for="ferme"> Question fermé </label>
              </div>
            </div>

            <div class="groupList">
              <select class="selectGroupList" name="groupes" id="groupes_dropdown" multiple required>
                {% for groupe in groupes %}
                  <option value="{{groupe[0]}}"> {{groupe[1]}} </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <input class="postButton" type="submit" value="Poster">
        </form>
      </dialog>
      {% endif %}
    </div>
  </header>

  <div class="topbar-dropdown">
    <a class="topbar-dropdown-btn" href="{{url_for('groups_page')}}"> Groupes </a>
    <a class="topbar-dropdown-btn" href="{{url_for('membres')}}"> Membres </a>
  </div>
  </section>

  <!-- CONTENU -->
  <main class="container">
    <section class="section">
      <div class="section-head">
        <h2>Discussions</h2>
        <div id="countInfo" class="muted"></div>
      </div>

      <div id="discussionsList" class="list"></div>
        {% for d in discussions %}
            <dialog id="editDiscussion_{{d[2]}}">
              <button id="closePage" commandfor="editDiscussion_{{d[2]}}" command="request-close">
                x
              </button>

              <form class="newDiscussionForm" method="post" action="{{url_for('modifier_discussion',d_id=d[2])}}">
                <label> Modifier la discussion</label>
                <div class="discussionInformation">
                  <input type="text" class="questionBlock" name='discussionTitle' placeholder=" Ajouter un titre" value={{d[0]}} required>
                  <textarea type="text" class="contentBlock" name="discussionContent" placeholder=" Ajouter une description" required>{{d[1]}}</textarea>
                  </div>

                  <div class="form-choices">
                    <div class="discussionType">
                      <div>
                        <input type="radio" name="discussionType" id="ouvert" value="ouvert" {% if d[7]=="OUVERT" %} checked {% endif %} required>
                        <label for="ouvert"> Proposition </label>
                      </div>
                      <div>
                        <input type="radio" name="discussionType" id="yesno" value="ferme" {% if d[7]=="FERMÉ"%} checked {%endif%} required>
                        <label for="ferme"> Question fermé </label>
                      </div>
                    </div>

                    <div class="groupList">
                      <select class="selectGroupList" name="groupes" id="groupes_dropdown" multiple required>
                        {% for groupe in groupes %}
                          {% if groupe in d[5] %}
                            <option value="{{groupe[0]}}" selected> {{groupe[1]}} </option>
                          {%else%}
                            <option value="{{groupe[0]}}" > {{groupe[1]}} </option>
                          {% endif %}
                        {% endfor %}
                      </select>
                    </div>
                  </div>

                  <input class="postButton" type="submit" value="Poster">
            
              </form>
            </dialog>
          {% endfor %}
      </div>
    </section>
  </main>

  <script>
    let all_discussions = [];

    async function chargerDiscussions() {
      const reponse = await fetch("/alldiscussions");
      const data = await reponse.json();
      all_discussions = data;
    }

    function renderDiscussions(items) {
      const list = document.getElementById("discussionsList");
      const countInfo = document.getElementById("countInfo");
      list.innerHTML = "";
      countInfo.textContent = items.length + " discussion(s)";

      if (!items.length) {
        list.innerHTML = `<div class="empty">Aucune discussion trouvée.</div>`;
        return;
      }

      items.forEach(d => {
        const card = document.createElement("div");
        card.className = "card";

        const badgeClass = d.type === "Question" ? "badge-q" : "badge-prop";
        const groupesHtml = d.groupes.map(g =>
          `<a href="/group_info/${g.id}" style="color: rgba(0,204,255,0.83);">${g.nom}</a>`
        ).join(" ");

        card.innerHTML = `
          <div class="card-top">
            <div class="card-title">
              <span class="badge ${badgeClass}">${d.type}</span>
              <span class="title-text">${d.titre}</span>
            </div>
            <div class="card-date">${d.date}, ${d.heure}</div>
          </div>
          <div class="card-desc">${d.contenu}</div>
          <div class="card-bottom">
            <div class="card-meta">
              <span>Groupes:</span> ${groupesHtml}
              <span class="dot">•</span>
              <span>Auteur: ${d.auteur}</span>
            </div>
            <div class="card-actions">
              <a class="btn" href="/main/${d.id}">Ouvrir</a>
              <a class="vote" href="/like_discussion/${d.id}/like?origin_page=homepage">👍 ${d.likes}</a>
              <a class="vote" href="/like_discussion/${d.id}/unlike?origin_page=homepage">👎 ${d.dislikes}</a>
              {%if role >= 2 %}
                <button class="btn" commandfor="editDiscussion_${d.id}" command="show-modal">Editer</button>
              {%endif%}
            </div>
        `;

        list.appendChild(card);
      });
    }

    function appliquerRecherche() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtres = all_discussions.filter(d => d.titre.toLowerCase().includes(q));
      renderDiscussions(filtres);
    }

    document.getElementById("searchInput").addEventListener("input", appliquerRecherche);

    async function initialiserDiscussions() {
      await chargerDiscussions();
      renderDiscussions(all_discussions);
    }

    initialiserDiscussions();
  </script>
</body>
</html>
